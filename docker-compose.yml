services:
  mock-server:
    build:
      context: .
      dockerfile: mock-server/Dockerfile
    ports:
      - '3001:3001'
    env_file:
      - .env
    environment:
      MOCK_PORT: 3001
      MOCK_DELAY_MS: ${MOCK_DELAY_MS:-0}
      MOCK_ERROR_RATE: ${MOCK_ERROR_RATE:-0}

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8080:80'
    depends_on:
      - mock-server

